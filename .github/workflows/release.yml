name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for a new version
        id: version
        run: |
          version=$(jq -r '.version' .claude-plugin/plugin.json)
          tag="gladly--v$version"
          # fetch-depth: 0 fetches remote tags, so this reflects the remote.
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "Tag $tag already exists. Nothing to release."
            echo "needs_tag=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_tag=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v6
        if: steps.version.outputs.needs_tag == 'true'
        with:
          node-version: 22

      - name: Install Claude Code
        if: steps.version.outputs.needs_tag == 'true'
        run: npm install -g @anthropic-ai/claude-code@2.1.301

      - name: Tag the release
        if: steps.version.outputs.needs_tag == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          claude plugin tag --push .
